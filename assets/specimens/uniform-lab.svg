<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="The Uniform Lab architectural specimen plate">
  <rect width="800" height="500" fill="#FAF5F2"/>
  <!-- Browser Chrome -->
  <rect x="0" y="0" width="800" height="36" fill="#FFFDF9"/>
