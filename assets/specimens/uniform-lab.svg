  <text x="580" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#5C5A52">100% Cotton</text>
  <text x="690" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#17190F">BULK</text>
  <line x1="348" y1="284" x2="748" y2="284" stroke="#E3D9CE" stroke-width="1"/>

  <text x="348" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#5C5A52">UL-312</text>
  <text x="420" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#17190F">Plant Coverall Suit</text>
  <text x="580" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#5C5A52">Twill Heavy</text>
  <text x="690" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#17190F">BULK</text>
  <line x1="348" y1="326" x2="748" y2="326" stroke="#E3D9CE" stroke-width="1"/>

  <!-- Bottom Visual Pattern Swatches -->
  <rect x="348" y="348" width="124" height="96" rx="6" fill="#FAF5F2" stroke="#E3D9CE" stroke-width="1"/>
  <line x1="364" y1="372" x2="456" y2="372" stroke="#CFC3B4" stroke-width="1.5"/>
  <line x1="364" y1="388" x2="432" y2="388" stroke="#E3D9CE" stroke-width="1.5"/>
  <text x="364" y="426" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#5C5A52">WANOWRIE STORE</text>

  <rect x="486" y="348" width="124" height="96" rx="6" fill="#F3ECE4" stroke="#E3D9CE" stroke-width="1"/>
  <line x1="502" y1="372" x2="594" y2="372" stroke="#CFC3B4" stroke-width="1.5"/>
  <line x1="502" y1="388" x2="570" y2="388" stroke="#E3D9CE" stroke-width="1.5"/>
  <text x="502" y="426" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#5C5A52">HADAPSAR STORE</text>

  <rect x="624" y="348" width="124" height="96" rx="6" fill="#17190F"/>
  <circle cx="732" cy="364" r="3.5" fill="#FF9D00"/>
