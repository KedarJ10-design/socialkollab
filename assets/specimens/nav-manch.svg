  <line x1="56" y1="422" x2="360" y2="422" stroke="#E3D9CE" stroke-width="2"/>

  <!-- Right Section Rail -->
  <rect x="488" y="162" width="280" height="306" rx="8" fill="#FFFDF9" stroke="#E3D9CE" stroke-width="1"/>
