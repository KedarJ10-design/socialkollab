<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Nav Manch Marathi digital news portal specimen plate">
  <rect width="800" height="500" fill="#FAF5F2"/>
  <!-- Browser Chrome -->
  <rect x="0" y="0" width="800" height="36" fill="#FFFDF9"/>
  <line x1="0" y1="36" x2="800" y2="36" stroke="#E3D9CE" stroke-width="1"/>
  <circle cx="20" cy="18" r="4" fill="#FF9D00"/>
  <circle cx="34" cy="18" r="4" fill="#CFC3B4"/>
  <circle cx="48" cy="18" r="4" fill="#E3D9CE"/>
